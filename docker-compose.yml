services:
  postgis:
    image: postgis/postgis:15-3.3-alpine
    container_name: santrapik-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: santrapik
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - santrapik_pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d santrapik"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: santrapik-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgis:5432/santrapik
      PORT: 8000
      HOST: 0.0.0.0
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:80","http://127.0.0.1:5173","http://127.0.0.1:80"]'
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: santrapik-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  santrapik_pgdata:
    name: santrapik_pgdata
